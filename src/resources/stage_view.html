<html lang="eng">
    <head>
       <title>ProjectOn Web Remote</title>
       <style>
          body {
             overflow: hidden;
             margin: 0;
             padding: 0;
             background: black;
          }

          #lyric_container {
             position: absolute;
             top: 0;
             left: 0;
             width: 80vw;
             height: 100vh;
             display: table;
             overflow: clip;
          }

          #lyric_display {
             text-align: center;
             display: table-cell;
             vertical-align: middle;
             font-family: "Arial";
             font-weight: bold;
             line-height: 150%;
             color: white;
             /*overflow: hidden;*/
          }

          #image_display {
             position: absolute;
             top: 0;
             left: 0;
             width: 80vw;
             height: 100vh;
             object-fit: fill;
             transform: translateZ(0);
             z-index: 1;
             will-change: contents;
             image-rendering: crisp-edges;
             display: hidden;
             backface-visibility: hidden;
          }

          #info_container {
             position: absolute;
             top: 0;
             left: 80vw;
             width: 20vw;
             height: 100vh;
             border-left: 2px solid #ffffff;
             display: flex;
             justify-content: space-between;
             flex-direction: column;
          }

          #clock {
             width: 100%
             text-align: center;
             font-family: "sans";
             font-weight: bold;
             font-size: 9vh;
             color: #ffffff;
             text-shadow: 5px 5px 5px black;
             align-self: center;
          }

          #slide_number {
             width: 100%;
             text-align: center;
             font-family: "sans";
             font-weight: bold;
             font-size: 9vh;
             color: #ffffff;
             text-shadow: 5px 5px 5px black;
             align-self: center;
          }
       </style>
    </head>

    <body>
       <div id="lyric_container">
          <div id="lyric_display"></div>
       </div>
       <canvas id="image_display"></canvas>
       <div id="info_container">
           <div id="clock"></div>
           <div id="slide_number"></div>
       </div>
    </body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
            integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
            crossorigin="anonymous"></script>

    <script type="text/javascript" charset="utf-8">
       var socket = io();

       const imageDisplay   = document.getElementById('image_display');
       const lyricDisplay   = document.getElementById('lyric_display');
       const lyricContainer = document.getElementById('lyric_container');
       const slideNumber    = document.getElementById('slide_number');
       const clock          = document.getElementById('clock');

       // -- Mode switching helpers ----------------------------------------------
       function showTextMode() {
          imageDisplay.style.display   = 'none';
          lyricContainer.style.display = 'table';
       }

       function showImageMode() {
          lyricContainer.style.display = 'none';
          imageDisplay.style.display   = 'block';
       }

       // -- Text update ---------------------------------------------------------
       let font_size = 90;
       socket.on('update_stage', function(text) {
          showTextMode();
          font_size = text[1];
          lyricDisplay.innerHTML = text[0];
          slideNumber.innerHTML = text[2];
          adjusted_font_size = 120;
          lyricDisplay.style.fontSize = adjusted_font_size + 'px';
          slideNumber.style.fontSize = font_size + 'px';

          target_height = window.innerHeight;
          lyric_display_height = lyricDisplay.getBoundingClientRect().height;
          console.log(lyric_display_height + ', ' + target_height);
          while (lyric_display_height > target_height) {
             adjusted_font_size -= 6;
             lyricDisplay.style.fontSize = adjusted_font_size + 'px';
             lyric_display_height = lyricDisplay.getBoundingClientRect().height;
             console.log(lyric_display_height + ', ' + target_height);
          }
       });

       // -- Image update --------------------------------------------------------
       const canvas = document.getElementById('image_display');
       const bitmapCtx = canvas.getContext('bitmaprenderer');
       socket.on('update_display', async (data) => {
           showImageMode();
           const blob = new Blob([data[0]], { type: 'image/jpeg' });
           const bitmap = await createImageBitmap(blob);
           bitmapCtx.transferFromImageBitmap(bitmap);
       });

       window.onload = function () {
          let timer = setInterval(changeClock, 1000);
       };

       function changeClock() {
          const currentDate = new Date();
          let hours = currentDate.getHours();
          let minutes = currentDate.getMinutes();
          if (minutes < 10) {
             minutes = '0' + minutes;
          }
          let formattedTime = hours + ":" + minutes;

          clock.style.fontSize = font_size + 'px';
          clock.textContent = formattedTime;
       }
    </script>
</html>
